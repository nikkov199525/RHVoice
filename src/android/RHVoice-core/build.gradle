apply plugin: 'com.android.application'

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

ext.major_version = 1
ext.minor_version = 18
ext.revision_number = 4
ext.baseVersionCode = 100000 * major_version + 1000 * minor_version + 10 * revision_number

task BoostIncludes(type: Sync) {
    into rootProject.file("../../external/libs/boost/include/boost")
    rootProject.file("../../external/libs/boost/libs").eachDir { libraryDir ->
        File includeDir = new File(libraryDir, "include/boost")
        if (includeDir.isDirectory()) {
            from includeDir
        }
    }
    includeEmptyDirs = false
}

def embeddedAssetsDir = layout.buildDirectory.dir("generated/embeddedAssets")
def embeddedDataDir = layout.buildDirectory.dir("generated/embeddedData")
def embeddedSourceRoot = providers.gradleProperty("RHVoice.embeddedSourceRoot")
        .map { rootProject.file(it) }
        .getOrElse(rootProject.file("../.."))
def embeddedProfile = providers.gradleProperty("RHVoice.embeddedProfile")
        .getOrElse("standard")
def customVoicesRoot = providers.gradleProperty("RHVoice.customVoicesDir")
        .map { rootProject.file(it) }
        .getOrElse(rootProject.file("../../../customvoices"))
def nestedCustomVoicesDir = new File(customVoicesRoot, "data/voices")
def customVoicesDir = nestedCustomVoicesDir.isDirectory()
        ? nestedCustomVoicesDir
        : customVoicesRoot
def packageDirectoryTemplate = file("src/main/res/raw/packages.json")

if (!(embeddedProfile in ["standard", "standalone"])) {
    throw new GradleException(
            "Unknown RHVoice.embeddedProfile '${embeddedProfile}'; expected standard or standalone"
    )
}

def readInfo = { File infoFile ->
    Properties properties = new Properties()
    infoFile.withReader("UTF-8") { properties.load(it) }
    properties
}

def hasNonZeroContent = { File file ->
    if (!file.isFile() || file.length() == 0) {
        return false
    }
    file.withInputStream { stream ->
        byte[] buffer = new byte[8192]
        int count
        while ((count = stream.read(buffer)) != -1) {
            for (int i = 0; i < count; i++) {
                if (buffer[i] != 0) {
                    return true
                }
            }
        }
        false
    }
}

def findDataDirectories = { File parentDir, String infoFileName ->
    parentDir.listFiles()
            ?.findAll { it.isDirectory() && new File(it, infoFileName).isFile() }
            ?.sort { it.name.toLowerCase(Locale.ROOT) }
            ?: []
}

def languageCodes = [
        "Albanian"             : ["sq", "sqi"],
        "Belarusian"           : ["be", "bel"],
        "Brazilian-Portuguese" : ["pt", "por"],
        "Croatian"             : ["hr", "hrv"],
        "Czech"                : ["cs", "ces"],
        "English"              : ["en", "eng"],
        "Esperanto"            : ["eo", "epo"],
        "Georgian"             : ["ka", "kat"],
        "Kyrgyz"               : ["ky", "kir"],
        "Luxembourgish"        : ["lb", "ltz"],
        "Macedonian"           : ["mk", "mkd"],
        "Polish"               : ["pl", "pol"],
        "Romanian"             : ["ro", "ron"],
        "Russian"              : ["ru", "rus"],
        "Serbian"              : ["sr", "srp"],
        "Slovak"               : ["sk", "slk"],
        "Spanish"              : ["es", "spa"],
        "Tatar"                : ["tt", "tat"],
        "Ukrainian"            : ["uk", "ukr"],
        "Uzbek"                : ["uz", "uzb"]
]
def defaultVoiceCountries = [
        "Russian": ["RU", "RUS"]
]

def languageRoot = new File(embeddedSourceRoot, "data/languages")
def voiceRoot = new File(embeddedSourceRoot, "data/voices")
def languageSources = embeddedProfile == "standalone"
        ? findDataDirectories(languageRoot, "language.info")
        : [new File(languageRoot, "English"), new File(languageRoot, "Russian")]
def officialVoiceSources = embeddedProfile == "standalone"
        ? findDataDirectories(voiceRoot, "voice.info")
        : [new File(voiceRoot, "yuriy"), new File(voiceRoot, "aleksandr-hq")]

def prepareEmbeddedData = tasks.register("prepareEmbeddedData") {
    inputs.property("embeddedProfile", embeddedProfile)
    inputs.property("embeddedSourceRoot", embeddedSourceRoot.absolutePath)
    inputs.property("customVoicesRoot", customVoicesRoot.absolutePath)
    inputs.files(languageSources)
    inputs.files(officialVoiceSources)
    if (customVoicesRoot.isDirectory()) {
        inputs.dir(customVoicesRoot)
    }
    inputs.file(packageDirectoryTemplate)
    outputs.dir(embeddedAssetsDir)

    doLast {
        File stagingDir = embeddedDataDir.get().asFile
        File assetsDir = embeddedAssetsDir.get().asFile
        delete(stagingDir, assetsDir)
        stagingDir.mkdirs()
        assetsDir.mkdirs()

        Map<String, Object> template = new JsonSlurper().parse(packageDirectoryTemplate)
        Map<String, Map<String, Object>> templateLanguages = template.languages.collectEntries {
            [(it.name.toLowerCase(Locale.ROOT)): it]
        }
        Map<String, Map<String, Object>> languageResources = new LinkedHashMap<>()

        languageSources.each { File sourceDir ->
            File infoFile = new File(sourceDir, "language.info")
            if (!infoFile.isFile()) {
                throw new GradleException("Invalid embedded language directory: ${sourceDir}")
            }
            File phonemesFile = new File(sourceDir, "phonemes.xml")
            if (!phonemesFile.isFile() ||
                    !phonemesFile.getText("UTF-8").contains("<phonemes")) {
                throw new GradleException(
                        "Invalid embedded language data in ${sourceDir}: phonemes.xml is missing or corrupt"
                )
            }
            copy {
                from sourceDir
                into new File(stagingDir, "languages/${sourceDir.name}")
                exclude ".git"
            }

            Properties info = readInfo(infoFile)
            String languageName = info.getProperty("name") ?: sourceDir.name
            Map<String, Object> templateLanguage =
                    templateLanguages[languageName.toLowerCase(Locale.ROOT)]
            List<String> codes = languageCodes[languageName]
            if (templateLanguage == null && codes == null) {
                throw new GradleException(
                        "No Android locale metadata is available for embedded language ${languageName}"
                )
            }
            languageResources[languageName.toLowerCase(Locale.ROOT)] = [
                    lang2code   : templateLanguage?.lang2code ?: codes[0],
                    lang3code   : templateLanguage?.lang3code ?: codes[1],
                    testMessage: templateLanguage?.testMessage
                            ?: "The ${languageName} voice is installed and working.",
                    name        : languageName,
                    version     : [
                            major: Integer.parseInt(info.getProperty("format")),
                            minor: Integer.parseInt(info.getProperty("revision"))
                    ],
                    dataUrl     : "",
                    dataMd5     : "",
                    id          : info.getProperty("android_id")
                            ?: templateLanguage?.id
                            ?: languageName.toLowerCase(Locale.ROOT).replace("-", "_"),
                    pseudoEnglish: languageName.equalsIgnoreCase("Russian"),
                    voices      : []
            ]
        }

        List<File> voiceSources = new ArrayList<>(officialVoiceSources)
        List<File> customVoiceSources = findDataDirectories(customVoicesDir, "voice.info")
        if (!customVoicesRoot.isDirectory()) {
            logger.lifecycle(
                    "customvoices was not found at ${customVoicesRoot}; " +
                            "building ${embeddedProfile} with repository voices only"
            )
        } else if (customVoiceSources.isEmpty()) {
            logger.lifecycle(
                    "No custom voices were found below ${customVoicesRoot}; " +
                            "building ${embeddedProfile} with repository voices only"
            )
        } else {
            logger.lifecycle(
                    "Including ${customVoiceSources.size()} custom voice(s) from ${customVoicesDir}"
            )
            voiceSources.addAll(customVoiceSources)
        }

        Set<String> embeddedVoiceNames = new HashSet<>()
        Set<String> embeddedVoiceIds = new HashSet<>()
        voiceSources.each { File sourceDir ->
            File infoFile = new File(sourceDir, "voice.info")
            if (!infoFile.isFile()) {
                throw new GradleException("Invalid embedded voice directory: ${sourceDir}")
            }
            Properties info = readInfo(infoFile)
            String voiceName = info.getProperty("name")
            if (!voiceName) {
                throw new GradleException("Voice name is missing in ${infoFile}")
            }
            String languageName = info.getProperty("language")
            Map<String, Object> languageResource =
                    languageResources[languageName?.toLowerCase(Locale.ROOT)]
            if (languageResource == null) {
                throw new GradleException(
                        "Voice ${voiceName} uses language ${languageName}, " +
                                "which is not included in the ${embeddedProfile} profile"
                )
            }
            File voiceDataFile = new File(sourceDir, "24000/voice.data")
            if (!voiceDataFile.isFile()) {
                voiceDataFile = new File(sourceDir, "16000/voice.data")
            }
            if (!hasNonZeroContent(voiceDataFile)) {
                throw new GradleException(
                        "Invalid embedded voice data in ${sourceDir}: voice.data is missing or corrupt"
                )
            }

            Map<String, Object> templateLanguage =
                    templateLanguages[languageName.toLowerCase(Locale.ROOT)]
            Map<String, Object> templateVoice = templateLanguage?.voices?.find {
                it.name.equalsIgnoreCase(voiceName) ||
                        (it.id && it.id.equalsIgnoreCase(
                                voiceName.toLowerCase(Locale.ROOT).replace("-", "_")))
            }
            String voiceId = info.getProperty("android_id")
                    ?: templateVoice?.id
                    ?: voiceName.toLowerCase(Locale.ROOT).replace("-", "_")
            List<String> defaultCountry = defaultVoiceCountries[languageName] ?: ["", ""]
            if (!embeddedVoiceNames.add(voiceName.toLowerCase(Locale.ROOT))) {
                throw new GradleException("Duplicate embedded voice name: ${voiceName}")
            }
            if (!embeddedVoiceIds.add(voiceId.toLowerCase(Locale.ROOT))) {
                throw new GradleException("Duplicate embedded voice id: ${voiceId}")
            }
            copy {
                from sourceDir
                into new File(stagingDir, "voices/${voiceName}")
                exclude ".git"
            }
            languageResource.voices.add([
                    name     : voiceName,
                    ctry2code: templateVoice?.ctry2code ?: defaultCountry[0],
                    ctry3code: templateVoice?.ctry3code ?: defaultCountry[1],
                    accent   : templateVoice?.accent ?: "",
                    demoUrl  : "",
                    version  : [
                            major: Integer.parseInt(info.getProperty("format")),
                            minor: Integer.parseInt(info.getProperty("revision"))
                    ],
                    dataUrl  : "",
                    dataMd5  : "",
                    id       : voiceId
            ])
        }

        List<Map<String, Object>> packagedLanguages = new ArrayList<>(languageResources.values())
        packagedLanguages.each { language ->
            language.voices.sort { it.name.toLowerCase(Locale.ROOT) }
        }

        Map<String, Map<String, String>> defaultVoices = new LinkedHashMap<>()
        packagedLanguages.each { language ->
            if (language.voices.isEmpty()) {
                return
            }
            Set<String> availableIds = language.voices.collect { it.id } as Set
            Map<String, String> defaults = new LinkedHashMap<>()
            if (embeddedProfile == "standard" && language.lang2code == "ru" &&
                    availableIds.contains("yuriy")) {
                defaults["*"] = "yuriy"
            } else {
                template.defaultVoices?.get(language.lang2code)?.each { country, voiceId ->
                    if (availableIds.contains(voiceId)) {
                        defaults[country] = voiceId
                    }
                }
                if (!defaults.containsKey("*")) {
                    defaults["*"] = language.voices[0].id
                }
            }
            defaultVoices[language.lang2code] = defaults
        }

        Map<String, Object> packageDirectory = [
                ttl          : 86400,
                localTtl     : 0,
                languages    : packagedLanguages,
                defaultVoices: defaultVoices
        ]
        new File(stagingDir, "packages.json").setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(packageDirectory)),
                "UTF-8"
        )

        MessageDigest digest = MessageDigest.getInstance("SHA-256")
        fileTree(stagingDir).files.sort { a, b ->
            stagingDir.toPath().relativize(a.toPath()).toString() <=>
                    stagingDir.toPath().relativize(b.toPath()).toString()
        }.each { File file ->
            digest.update(stagingDir.toPath().relativize(file.toPath()).toString().getBytes("UTF-8"))
            file.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int count
                while ((count = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
        }
        String version = digest.digest().encodeHex().toString()
        new File(assetsDir, "embedded-data.version").setText(version, "UTF-8")

        ant.zip(
                destfile: new File(assetsDir, "embedded-data.zip"),
                basedir: stagingDir,
                level: 9
        )
    }
}

android {
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    compileSdk myCompileSdkVersion
    buildToolsVersion myBuildToolsVersion
    ndkVersion myNdkVersion
    namespace "com.github.olga_yakovleva.rhvoice.android"

    buildFeatures {
        prefab true
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir embeddedAssetsDir
        }
    }

    defaultConfig {
        multiDexEnabled true
        minSdk myMinSdkVersion
        targetSdk myTargetSdkVersion
        applicationId "com.github.olga_yakovleva.rhvoice.android"
        versionName "${major_version}.${minor_version}.${revision_number}"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            ndkBuild {
                arguments 'V=1'
                cppFlags = ['-fexceptions', '-frtti', '-std=c++11']
            }
        }
    }

    if (rootProject.signRelease) {
        signingConfigs {
            release {
                storeFile file(rootProject.property("RHVoice.keyStore"))
                storePassword rootProject.property("RHVoice.keyStorePassword")
                keyAlias rootProject.property("RHVoice.keyAlias")
                keyPassword rootProject.property("RHVoice.keyPassword")
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        // This variant keeps Java resources unminified for reliability while
        // compiling the native synthesizer with release optimizations. It is
        // signed with the local Android debug key so it can update a locally
        // installed build without storing signing secrets in the repository.
        optimized {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            versionNameSuffix '-optimized'
        }

        release {
            if (rootProject.signRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions 'dir'

    productFlavors {
        stable {
            dimension 'dir'
            versionCode = baseVersionCode
        }

        alpha {
            dimension 'dir'
            versionCode = baseVersionCode + 5
            versionNameSuffix '-alpha'
        }

        dev {
            dimension 'dir'
            versionCode = baseVersionCode + 9
            versionNameSuffix '-dev'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    def lifecycle_version = "2.5.1"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.work:work-runtime:2.8.1'

    implementation 'com.google.android.exoplayer:exoplayer-core:2.17.1'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.squareup.moshi:moshi:1.14.0'
    implementation 'io.github.vvb2060.ndk:curl:8.1.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.android.material:material:1.12.0'
}

preBuild.dependsOn BoostIncludes
preBuild.dependsOn prepareEmbeddedData

apply plugin: 'com.android.application'

import groovy.json.JsonOutput
import java.security.MessageDigest

ext.major_version = 1
ext.minor_version = 18
ext.revision_number = 4
ext.baseVersionCode = 100000 * major_version + 1000 * minor_version + 10 * revision_number

task BoostIncludes(type: Sync) {
    into rootProject.file("../../external/libs/boost/include/boost")
    rootProject.file("../../external/libs/boost/libs").eachDir { libraryDir ->
        File includeDir = new File(libraryDir, "include/boost")
        if (includeDir.isDirectory()) {
            from includeDir
        }
    }
    includeEmptyDirs = false
}

def embeddedAssetsDir = layout.buildDirectory.dir("generated/embeddedAssets")
def embeddedDataDir = layout.buildDirectory.dir("generated/embeddedData")
def customVoicesDir = providers.gradleProperty("RHVoice.customVoicesDir")
        .map { rootProject.file(it) }
        .getOrElse(rootProject.file("../../../customvoices/data/voices"))

def readInfo = { File infoFile ->
    Properties properties = new Properties()
    infoFile.withReader("UTF-8") { properties.load(it) }
    properties
}

def prepareEmbeddedData = tasks.register("prepareEmbeddedData") {
    def languageSources = [
            rootProject.file("../../data/languages/Russian"),
            rootProject.file("../../data/languages/English")
    ]
    def officialVoiceSources = [
            rootProject.file("../../data/voices/yuriy"),
            rootProject.file("../../data/voices/aleksandr-hq")
    ]

    inputs.files(languageSources)
    inputs.files(officialVoiceSources)
    inputs.dir(customVoicesDir).optional()
    outputs.dir(embeddedAssetsDir)

    doLast {
        if (!customVoicesDir.isDirectory()) {
            throw new GradleException(
                    "Custom voices were not found at ${customVoicesDir}. " +
                            "Set RHVoice.customVoicesDir to the directory containing voice folders."
            )
        }

        File stagingDir = embeddedDataDir.get().asFile
        File assetsDir = embeddedAssetsDir.get().asFile
        delete(stagingDir, assetsDir)
        stagingDir.mkdirs()
        assetsDir.mkdirs()

        languageSources.each { File sourceDir ->
            if (!new File(sourceDir, "language.info").isFile()) {
                throw new GradleException("Invalid embedded language directory: ${sourceDir}")
            }
            copy {
                from sourceDir
                into new File(stagingDir, "languages/${sourceDir.name}")
                exclude ".git"
            }
        }

        List<File> voiceSources = new ArrayList<>(officialVoiceSources)
        customVoicesDir.listFiles()
                ?.findAll { it.isDirectory() && new File(it, "voice.info").isFile() }
                ?.sort { it.name.toLowerCase(Locale.ROOT) }
                ?.each { voiceSources.add(it) }

        if (voiceSources.size() == officialVoiceSources.size()) {
            throw new GradleException("No custom voices were found in ${customVoicesDir}")
        }

        List<Map<String, Object>> voiceResources = []
        voiceSources.each { File sourceDir ->
            File infoFile = new File(sourceDir, "voice.info")
            if (!infoFile.isFile()) {
                throw new GradleException("Invalid embedded voice directory: ${sourceDir}")
            }
            Properties info = readInfo(infoFile)
            String voiceName = info.getProperty("name")
            if (!voiceName) {
                throw new GradleException("Voice name is missing in ${infoFile}")
            }
            copy {
                from sourceDir
                into new File(stagingDir, "voices/${voiceName}")
                exclude ".git"
            }
            voiceResources.add([
                    name     : voiceName,
                    ctry2code: "RU",
                    ctry3code: "RUS",
                    version  : [
                            major: Integer.parseInt(info.getProperty("format")),
                            minor: Integer.parseInt(info.getProperty("revision"))
                    ],
                    dataUrl  : "",
                    dataMd5  : "",
                    id       : voiceName.toLowerCase(Locale.ROOT).replace("-", "_")
            ])
        }

        Properties russianInfo = readInfo(new File(languageSources[0], "language.info"))
        Properties englishInfo = readInfo(new File(languageSources[1], "language.info"))
        Map<String, Object> packageDirectory = [
                ttl          : 86400,
                localTtl     : 0,
                languages    : [
                        [
                                lang2code   : "en",
                                lang3code   : "eng",
                                testMessage: "If you can hear this message, the voice is installed and working.",
                                name        : "English",
                                version     : [
                                        major: Integer.parseInt(englishInfo.getProperty("format")),
                                        minor: Integer.parseInt(englishInfo.getProperty("revision"))
                                ],
                                dataUrl     : "",
                                dataMd5     : "",
                                id          : "english",
                                voices      : []
                        ],
                        [
                                lang2code   : "ru",
                                lang3code   : "rus",
                                testMessage: "Если вы слышите это сообщение, значит, голос установлен и работает.",
                                name        : "Russian",
                                version     : [
                                        major: Integer.parseInt(russianInfo.getProperty("format")),
                                        minor: Integer.parseInt(russianInfo.getProperty("revision"))
                                ],
                                dataUrl     : "",
                                dataMd5     : "",
                                id          : "russian",
                                pseudoEnglish: true,
                                voices      : voiceResources
                        ]
                ],
                defaultVoices: [ru: ["*": "yuriy"]]
        ]
        new File(stagingDir, "packages.json").setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(packageDirectory)),
                "UTF-8"
        )

        MessageDigest digest = MessageDigest.getInstance("SHA-256")
        fileTree(stagingDir).files.sort { a, b ->
            stagingDir.toPath().relativize(a.toPath()).toString() <=>
                    stagingDir.toPath().relativize(b.toPath()).toString()
        }.each { File file ->
            digest.update(stagingDir.toPath().relativize(file.toPath()).toString().getBytes("UTF-8"))
            file.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int count
                while ((count = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, count)
                }
            }
        }
        String version = digest.digest().encodeHex().toString()
        new File(assetsDir, "embedded-data.version").setText(version, "UTF-8")

        ant.zip(
                destfile: new File(assetsDir, "embedded-data.zip"),
                basedir: stagingDir,
                level: 9
        )
    }
}

android {
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    compileSdk myCompileSdkVersion
    buildToolsVersion myBuildToolsVersion
    ndkVersion myNdkVersion
    namespace "com.github.olga_yakovleva.rhvoice.android"

    buildFeatures {
        prefab true
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir embeddedAssetsDir
        }
    }

    defaultConfig {
        multiDexEnabled true
        minSdk myMinSdkVersion
        targetSdk myTargetSdkVersion
        applicationId "com.github.olga_yakovleva.rhvoice.android"
        versionName "${major_version}.${minor_version}.${revision_number}"
        ndk {
            abiFilters 'armeabi-v7a', 'x86', 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            ndkBuild {
                arguments 'V=1'
                cppFlags = ['-fexceptions', '-frtti', '-std=c++11']
            }
        }
    }

    if (rootProject.signRelease) {
        signingConfigs {
            release {
                storeFile file(rootProject.property("RHVoice.keyStore"))
                storePassword rootProject.property("RHVoice.keyStorePassword")
                keyAlias rootProject.property("RHVoice.keyAlias")
                keyPassword rootProject.property("RHVoice.keyPassword")
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        release {
            if (rootProject.signRelease) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions 'dir'

    productFlavors {
        stable {
            dimension 'dir'
            versionCode = baseVersionCode
        }

        alpha {
            dimension 'dir'
            versionCode = baseVersionCode + 5
            versionNameSuffix '-alpha'
        }

        dev {
            dimension 'dir'
            versionCode = baseVersionCode + 9
            versionNameSuffix '-dev'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    def lifecycle_version = "2.5.1"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.work:work-runtime:2.8.1'

    implementation 'com.google.android.exoplayer:exoplayer-core:2.17.1'
    implementation 'com.google.guava:guava:31.1-android'
    implementation 'com.squareup.moshi:moshi:1.14.0'
    implementation 'io.github.vvb2060.ndk:curl:8.1.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'com.google.android.material:material:1.12.0'
}

preBuild.dependsOn BoostIncludes
preBuild.dependsOn prepareEmbeddedData
